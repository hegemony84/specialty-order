<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스페셜티 오더 — 통계</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --green-dark:  #1E3932;
    --green-mid:   #2C5F2E;
    --green-light: #D4E9D2;
    --green-pale:  #F2F7F2;
    --gold:        #CBA258;
    --gold-light:  #F5EDD8;
    --blue:        #3A7BD5;
    --blue-light:  #DEEAFF;
    --text:        #1E3932;
    --text-sub:    #6B8F71;
    --text-dim:    #A8C4AB;
    --border:      #D4E4D4;
    --bg:          #F2F7F2;
    --surface:     #FFFFFF;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* ── 헤더 ── */
  header {
    background: var(--green-dark);
    padding: 20px 28px 18px;
    display: flex; align-items: flex-end;
    justify-content: space-between;
  }

  .header-brand { display: flex; flex-direction: column; gap: 2px; }
  .header-en { font-size: 10px; color: var(--gold); font-weight: 500; letter-spacing: 0.2em; }
  .header-ko { font-family: 'Noto Serif KR', serif; font-size: 18px; color: white; }
  .header-sub { font-size: 11px; color: rgba(255,255,255,0.4); font-weight: 300; margin-top: 2px; }

  .header-right { display: flex; align-items: center; gap: 10px; }

  /* 기간 필터 */
  .filter-wrap {
    display: flex; gap: 6px;
  }

  .filter-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1.5px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    font-size: 12px; font-weight: 500;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer; transition: all 0.15s;
  }

  .filter-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: var(--green-dark);
    font-weight: 700;
  }

  /* ── 메인 콘텐츠 ── */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 24px 48px;
  }

  /* ── 요약 카드 4개 ── */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }

  @media (max-width: 768px) {
    .summary-grid { grid-template-columns: repeat(2, 1fr); }
    header { flex-direction: column; align-items: flex-start; gap: 14px; }
  }

  @media (max-width: 480px) {
    .summary-grid { grid-template-columns: 1fr 1fr; }
  }

  .summary-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px 18px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(30,57,50,0.06);
    position: relative; overflow: hidden;
  }

  .summary-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
  }

  .summary-card.c1::before { background: var(--gold); }
  .summary-card.c2::before { background: var(--blue); }
  .summary-card.c3::before { background: var(--green-mid); }
  .summary-card.c4::before { background: #E07B54; }

  .summary-label {
    font-size: 11px; font-weight: 700;
    color: var(--text-sub); letter-spacing: 0.05em;
    margin-bottom: 8px;
  }

  .summary-value {
    font-size: 36px; font-weight: 700;
    color: var(--text); line-height: 1;
  }

  .summary-unit {
    font-size: 14px; font-weight: 400;
    color: var(--text-sub); margin-left: 4px;
  }

  /* ── 섹션 ── */
  .section-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 768px) {
    .section-grid { grid-template-columns: 1fr; }
  }

  .section-card {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px 20px 16px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(30,57,50,0.06);
  }

  .section-title {
    font-size: 13px; font-weight: 700;
    color: var(--text); margin-bottom: 16px;
    display: flex; align-items: center; gap: 6px;
  }

  .section-title-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--gold); flex-shrink: 0;
  }

  /* 바 차트 */
  .bar-row {
    display: flex; align-items: center;
    gap: 10px; margin-bottom: 10px;
  }

  .bar-label {
    font-size: 12px; font-weight: 500;
    color: var(--text); min-width: 120px;
    white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; flex-shrink: 0;
  }

  .bar-track {
    flex: 1; height: 10px;
    background: var(--green-pale);
    border-radius: 5px; overflow: hidden;
  }

  .bar-fill {
    height: 100%; border-radius: 5px;
    transition: width 0.6s ease;
  }

  .bar-value {
    font-size: 12px; font-weight: 700;
    color: var(--text); min-width: 36px;
    text-align: right; flex-shrink: 0;
  }

  /* 시간대 차트 */
  .time-chart {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 120px;
    padding-bottom: 20px;
    position: relative;
  }

  .time-col {
    flex: 1; display: flex;
    flex-direction: column;
    align-items: center; gap: 4px;
    position: relative;
  }

  .time-bar-wrap {
    flex: 1; width: 100%;
    display: flex; align-items: flex-end;
  }

  .time-bar {
    width: 100%; border-radius: 4px 4px 0 0;
    background: var(--green-mid);
    transition: height 0.6s ease;
    min-height: 2px;
  }

  .time-bar.peak { background: var(--gold); }

  .time-label {
    font-size: 10px; color: var(--text-sub);
    font-weight: 300; text-align: center;
    position: absolute; bottom: -18px;
    white-space: nowrap;
  }

  .time-count {
    font-size: 10px; color: var(--text-sub);
    font-weight: 500;
  }

  /* 비율 도넛 */
  .ratio-wrap {
    display: flex; gap: 16px; align-items: center;
    flex-wrap: wrap;
  }

  .ratio-item {
    display: flex; align-items: center; gap: 8px;
    flex: 1; min-width: 100px;
    background: var(--green-pale);
    border-radius: 12px; padding: 12px 14px;
  }

  .ratio-dot {
    width: 10px; height: 10px;
    border-radius: 50%; flex-shrink: 0;
  }

  .ratio-info { flex: 1; }
  .ratio-name { font-size: 12px; font-weight: 500; color: var(--text); }
  .ratio-pct  { font-size: 18px; font-weight: 700; color: var(--text); }
  .ratio-cnt  { font-size: 11px; color: var(--text-sub); font-weight: 300; }

  /* 장소 테이블 */
  .place-table {
    width: 100%; border-collapse: collapse;
  }

  .place-table th {
    font-size: 11px; font-weight: 700;
    color: var(--text-sub); text-align: left;
    padding: 0 8px 10px; border-bottom: 1px solid var(--border);
    letter-spacing: 0.04em;
  }

  .place-table td {
    font-size: 13px; padding: 9px 8px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }

  .place-table tr:last-child td { border-bottom: none; }

  .place-rank {
    font-size: 11px; font-weight: 700;
    color: var(--text-dim); width: 24px;
  }

  .place-rank.top { color: var(--gold); }

  .place-bar-cell { width: 40%; }

  .place-bar-track {
    height: 6px; background: var(--green-pale);
    border-radius: 3px; overflow: hidden;
  }

  .place-bar-fill {
    height: 100%; border-radius: 3px;
    background: var(--blue);
    transition: width 0.6s ease;
  }

  .place-count {
    font-weight: 700; color: var(--blue);
    text-align: right; white-space: nowrap;
  }

  /* 로딩 */
  .loading {
    text-align: center; padding: 60px 20px;
    color: var(--text-dim);
  }

  .loading-spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--green-mid);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* 빈 상태 */
  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--text-dim); font-size: 13px; font-weight: 300;
  }

  /* 풀 너비 섹션 */
  .section-full {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px 20px 16px;
    border: 1px solid var(--border);
    box-shadow: 0 1px 4px rgba(30,57,50,0.06);
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <span class="header-en">Specialty Order</span>
    <span class="header-ko">주문 통계</span>
    <span class="header-sub" id="headerSub">데이터 로딩 중...</span>
  </div>
  <div class="header-right">
    <div class="filter-wrap">
      <button class="filter-btn active" onclick="setFilter('today')">오늘</button>
      <button class="filter-btn" onclick="setFilter('week')">이번 주</button>
      <button class="filter-btn" onclick="setFilter('month')">이번 달</button>
      <button class="filter-btn" onclick="setFilter('all')">전체</button>
    </div>
  </div>
</header>

<div class="container" id="container">
  <div class="loading">
    <div class="loading-spinner"></div>
    데이터 불러오는 중...
  </div>
</div>

<script type="module">
  import { initializeApp }              from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection,
           getDocs }                    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey:            'AIzaSyBSv0AWNRGxhyq97MvI3Kc2S-cM8kXNdj4',
    authDomain:        'tfp-with-ai.firebaseapp.com',
    projectId:         'tfp-with-ai',
    storageBucket:     'tfp-with-ai.firebasestorage.app',
    messagingSenderId: '667927194187',
    appId:             '1:667927194187:web:e93bcb20fa80c438e2bbce',
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  let allOrders = [];
  let currentFilter = 'today';

  // ── 색상 팔레트 ──
  const COLORS = [
    '#1E3932','#3A7BD5','#CBA258','#4A7C59',
    '#E07B54','#7B5EA7','#3A9E8F','#D45A6A',
    '#8B7355','#5A8FC4',
  ];

  // ── 데이터 로드 ──
  async function loadData() {
    const snap = await getDocs(collection(db, 'orders'));
    allOrders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }

  // ── 필터 ──
  function setFilter(f) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    render();
  }
  window.setFilter = setFilter;

  function getFilteredOrders() {
    const now   = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const weekStart = new Date(today); weekStart.setDate(today.getDate() - today.getDay());
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);

    return allOrders.filter(o => {
      if (!o.createdAt) return currentFilter === 'all';
      const d = o.createdAt.toDate ? o.createdAt.toDate() : new Date(o.createdAt);
      if (currentFilter === 'today')  return d >= today;
      if (currentFilter === 'week')   return d >= weekStart;
      if (currentFilter === 'month')  return d >= monthStart;
      return true;
    });
  }

  // ── 렌더 ──
  function render() {
    const orders = getFilteredOrders();
    const container = document.getElementById('container');

    // 헤더 서브 텍스트
    const labels = { today:'오늘', week:'이번 주', month:'이번 달', all:'전체' };
    document.getElementById('headerSub').textContent =
      `${labels[currentFilter]} · 총 ${orders.length}건`;

    if (orders.length === 0) {
      container.innerHTML = `<div class="empty">📭 해당 기간에 주문 데이터가 없어요</div>`;
      return;
    }

    // ── 집계 ──
    let totalCups = 0;
    const menuTally  = {};
    const placeTally = {};
    const hourTally  = {};
    let deliveryCnt = 0, pickupCnt = 0;
    let hotCnt = 0, iceCnt = 0, singleCnt = 0;

    for (let h = 8; h <= 18; h++) hourTally[h] = 0;

    orders.forEach(o => {
      // 픽업/배달
      if (o.delivery === '배달') deliveryCnt++;
      else pickupCnt++;

      // 장소
      const place = o.place || '미입력';
      if (place !== '카페 픽업') {
        placeTally[place] = (placeTally[place] || 0) + 1;
      }

      // 시간대
      if (o.createdAt) {
        const d = o.createdAt.toDate ? o.createdAt.toDate() : new Date(o.createdAt);
        const h = d.getHours();
        if (h >= 8 && h <= 18) hourTally[h] = (hourTally[h] || 0) + 1;
      }

      // 메뉴
      (o.items || []).forEach(item => {
        const name = item.name || '';
        const qty  = item.qty  || 1;
        totalCups += qty;

        // HOT/ICE 분류
        if (name.includes('(HOT)')) hotCnt += qty;
        else if (name.includes('(ICE)')) iceCnt += qty;
        else singleCnt += qty;

        // 메뉴 집계 (HOT/ICE 구분 없이 메뉴명만)
        const baseName = name.replace(' (HOT)', '').replace(' (ICE)', '').replace('+ ', '');
        menuTally[baseName] = (menuTally[baseName] || 0) + qty;
      });
    });

    // 메뉴 정렬
    const menuEntries  = Object.entries(menuTally).sort((a,b) => b[1]-a[1]);
    const placeEntries = Object.entries(placeTally).sort((a,b) => b[1]-a[1]).slice(0, 10);
    const maxMenu  = menuEntries[0]?.[1] || 1;
    const maxPlace = placeEntries[0]?.[1] || 1;
    const maxHour  = Math.max(...Object.values(hourTally), 1);
    const totalOrders = orders.length;

    // ── HTML 생성 ──
    container.innerHTML = `

      <!-- 요약 카드 -->
      <div class="summary-grid">
        <div class="summary-card c1">
          <div class="summary-label">총 주문</div>
          <div class="summary-value">${totalOrders}<span class="summary-unit">건</span></div>
        </div>
        <div class="summary-card c2">
          <div class="summary-label">총 음료</div>
          <div class="summary-value">${totalCups}<span class="summary-unit">잔</span></div>
        </div>
        <div class="summary-card c3">
          <div class="summary-label">배달</div>
          <div class="summary-value">${deliveryCnt}<span class="summary-unit">건</span></div>
        </div>
        <div class="summary-card c4">
          <div class="summary-label">픽업</div>
          <div class="summary-value">${pickupCnt}<span class="summary-unit">건</span></div>
        </div>
      </div>

      <!-- 메뉴별 + HOT/ICE 비율 -->
      <div class="section-grid">
        <div class="section-card">
          <div class="section-title"><span class="section-title-dot"></span>메뉴별 판매량</div>
          ${menuEntries.length === 0 ? '<div class="empty">데이터 없음</div>' :
            menuEntries.map(([name, cnt], i) => `
              <div class="bar-row">
                <div class="bar-label">${name}</div>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${Math.round(cnt/maxMenu*100)}%;background:${COLORS[i%COLORS.length]};"></div>
                </div>
                <div class="bar-value">${cnt}잔</div>
              </div>`).join('')
          }
        </div>

        <div class="section-card">
          <div class="section-title"><span class="section-title-dot" style="background:var(--blue)"></span>온도 비율</div>
          <div class="ratio-wrap" style="margin-bottom:20px;">
            <div class="ratio-item">
              <div class="ratio-dot" style="background:#C0392B;"></div>
              <div class="ratio-info">
                <div class="ratio-name">HOT</div>
                <div class="ratio-pct">${hotCnt+iceCnt+singleCnt > 0 ? Math.round(hotCnt/(hotCnt+iceCnt+singleCnt)*100) : 0}%</div>
                <div class="ratio-cnt">${hotCnt}잔</div>
              </div>
            </div>
            <div class="ratio-item">
              <div class="ratio-dot" style="background:#1A6EA8;"></div>
              <div class="ratio-info">
                <div class="ratio-name">ICE</div>
                <div class="ratio-pct">${hotCnt+iceCnt+singleCnt > 0 ? Math.round(iceCnt/(hotCnt+iceCnt+singleCnt)*100) : 0}%</div>
                <div class="ratio-cnt">${iceCnt}잔</div>
              </div>
            </div>
            <div class="ratio-item">
              <div class="ratio-dot" style="background:var(--green-mid);"></div>
              <div class="ratio-info">
                <div class="ratio-name">기타</div>
                <div class="ratio-pct">${hotCnt+iceCnt+singleCnt > 0 ? Math.round(singleCnt/(hotCnt+iceCnt+singleCnt)*100) : 0}%</div>
                <div class="ratio-cnt">${singleCnt}잔</div>
              </div>
            </div>
          </div>

          <div class="section-title" style="margin-top:8px;"><span class="section-title-dot" style="background:#E07B54"></span>수령 방법</div>
          <div class="ratio-wrap">
            <div class="ratio-item">
              <div class="ratio-dot" style="background:#3A7BD5;"></div>
              <div class="ratio-info">
                <div class="ratio-name">배달</div>
                <div class="ratio-pct">${totalOrders > 0 ? Math.round(deliveryCnt/totalOrders*100) : 0}%</div>
                <div class="ratio-cnt">${deliveryCnt}건</div>
              </div>
            </div>
            <div class="ratio-item">
              <div class="ratio-dot" style="background:var(--green-mid);"></div>
              <div class="ratio-info">
                <div class="ratio-name">픽업</div>
                <div class="ratio-pct">${totalOrders > 0 ? Math.round(pickupCnt/totalOrders*100) : 0}%</div>
                <div class="ratio-cnt">${pickupCnt}건</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- 시간대별 주문 -->
      <div class="section-full">
        <div class="section-title"><span class="section-title-dot" style="background:var(--blue)"></span>시간대별 주문</div>
        <div class="time-chart">
          ${Object.entries(hourTally).map(([h, cnt]) => {
            const pct = Math.round(cnt / maxHour * 100);
            const isPeak = cnt === maxHour && cnt > 0;
            return `
              <div class="time-col">
                <div class="time-bar-wrap">
                  <div class="time-bar ${isPeak?'peak':''}" style="height:${pct}%;"></div>
                </div>
                <div class="time-label">${h}시</div>
              </div>`;
          }).join('')}
        </div>
      </div>

      <!-- 배달 장소 순위 -->
      <div class="section-full">
        <div class="section-title"><span class="section-title-dot" style="background:var(--blue)"></span>배달 장소 순위</div>
        ${placeEntries.length === 0
          ? '<div class="empty">배달 주문 데이터가 없어요</div>'
          : `<table class="place-table">
              <thead>
                <tr>
                  <th style="width:28px;">#</th>
                  <th>장소</th>
                  <th class="place-bar-cell"></th>
                  <th style="text-align:right;">주문</th>
                </tr>
              </thead>
              <tbody>
                ${placeEntries.map(([place, cnt], i) => `
                  <tr>
                    <td class="place-rank ${i<3?'top':''}">${i+1}</td>
                    <td>${place}</td>
                    <td class="place-bar-cell">
                      <div class="place-bar-track">
                        <div class="place-bar-fill" style="width:${Math.round(cnt/maxPlace*100)}%;"></div>
                      </div>
                    </td>
                    <td class="place-count">${cnt}건</td>
                  </tr>`).join('')}
              </tbody>
            </table>`
        }
      </div>
    `;
  }

  loadData();
</script>
</body>
</html>
